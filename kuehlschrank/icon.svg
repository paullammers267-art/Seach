<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".45" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fffa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#022c22" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- Haus mit weichen Ecken -->
  <path d="M256 118 L398 236 V378 a26 26 0 0 1 -26 26 H140 a26 26 0 0 1 -26 -26 V236 Z" fill="url(#house)" stroke="url(#house)" stroke-width="28" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Haken -->
  <path d="M184 306 L236 356 L332 258" fill="none" stroke="url(#check)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Funkeln -->
  <path d="M402 70 C406 100 414 108 444 112 C414 116 406 124 402 154 C398 124 390 116 360 112 C390 108 398 100 402 70 Z" fill="#fde68a"/>
  <path d="M446 158 C448 170 451 173 463 175 C451 177 448 180 446 192 C444 180 441 177 429 175 C441 173 444 170 446 158 Z" fill="#fef3c7" opacity=".9"/>
</svg>
